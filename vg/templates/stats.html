
{% extends "base.html" %}       {# 指令：继承母版，套壳 #}

{% block head%}
<script>
    function tick() {
        fetch("/api/stats")
            .then(function (resp){ return resp.json(); })
            .then(function (data){
                var status = document.getElementById("status");
                var numbers = document.getElementById("numbers");
                if (data.online) {
                    status.innerText = "场景在线";
                    numbers.innerText = "累计经过" + data.total + "人，其中停留超过" + data.seconds + "秒的有" + data.stayers + "人。";
                } else {
                    status.innerText = "场景还没上线";
                    numbers.innerText = "等run.py 跑起来，请稍等~~";
                }
            });
    }
    tick();
    setInterval(tick, 1000);
</script>

{% endblock %}

{% block content %}

<h1>人数统计</h1>
<p class="sub">每秒自动问一次接口，只换了数字，页面不重载</p>

    <div class="card serif">
        <p id="status">正在连接...</p>
        <p id="numbers"></p>
    </div>

{% endblock %}
